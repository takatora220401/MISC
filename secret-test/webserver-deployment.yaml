apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-webapp
  namespace: my-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-webapp
  template:
    metadata:
      labels:
        app: my-webapp
    spec:
      containers:
      - name: web-server
        image: demo-web-server:848613a
        ports:
        - containerPort: 8443
          protocol: TCP